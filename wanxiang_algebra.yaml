      - xform/(.)ei(\d)$/$1Ⓦ$2/
      - xform/uan(\d)$/Ⓡ$1/
      - xform/[uv]e(\d)$/Ⓣ$1/
      - xform/un(\d)$/Ⓨ$1/
      - xform/^sh/Ⓤ/
      - xform/^ch/Ⓘ/
      - xform/^zh/Ⓥ/
      - xform/uo(\d)$/Ⓞ$1/
      - xform/ie(\d)$/Ⓟ$1/
      - xform/(.)i?ong(\d)$/$1Ⓢ$2/
      - xform/ing(\d)$/Ⓚ$1/
      - xform/uai(\d)$/Ⓚ$1/
      - xform/(.)ai(\d)$/$1Ⓓ$2/
      - xform/(.)eng(\d)$/$1Ⓖ$2/
      - xform/(.)en(\d)$/$1Ⓕ$2/
      - xform/[iu]ang(\d)$/Ⓛ$1/
      - xform/(.)ang(\d)$/$1Ⓗ$2/
      - xform/ian(\d)$/Ⓜ$1/
      - xform/(.)an(\d)$/$1Ⓙ$2/
      - xform/(.)ou(\d)$/$1Ⓩ$2/
      - xform/[iu]a(\d)$/Ⓧ$1/
      - xform/iao(\d)$/Ⓝ$1/
      - xform/(.)ao(\d)$/$1Ⓒ$2/
      - xform/ui(\d)$/Ⓥ$1/
      - xform/in(\d)$/Ⓑ$1/
      - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/
      - xform/^(aj|ac|ad|ew|ef|oz)(\d?)$//
      - derive/^(..)(\d)$/$1/
      - derive/^(.).+(\d)$/$1$2/
      #- abbrev/^([a-z]).+$/$1/   #简拼

