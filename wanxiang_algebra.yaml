      - xform/ú([a-z]*)$/u$1②/
      - xform/ǔ([a-z]*)$/u$1③/
      - xform/ù([a-z]*)$/u$1④/
      - xform/ǖ([a-z]*)$/v$1①/
      - xform/ǘ([a-z]*)$/v$1②/
      - xform/ǚ([a-z]*)$/v$1③/
      - xform/ǜ([a-z]*)$/v$1④/
      - xform/ü/v/
      - xform/ń([a-z]*)$/n$1②/
      - xform/ň([a-z]*)$/n$1③/
      - xform/ǹ([a-z]*)$/n$1④/
      - xform/ḿ([a-z]*)$/m$1②/
      - xform/m̀([a-z]*)$/m$1④/
      - xlit/①②③④/7890
      - derive/^ng(\d)$/eng$1/
