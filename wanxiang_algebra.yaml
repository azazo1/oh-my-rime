      - xform/ō([^;]*);/o$1①;/
      - xform/ó([^;]*);/o$1②;/
      - xform/ǒ([^;]*);/o$1③;/
      - xform/ò([^;]*);/o$1④;/
      - xform/ē([^;]*);/e$1①;/
      - xform/é([^;]*);/e$1②;/
      - xform/ě([^;]*);/e$1③;/
      - xform/è([^;]*);/e$1④;/
      - xform/ī([^;]*);/i$1①;/
      - xform/í([^;]*);/i$1②;/
      - xform/ǐ([^;]*);/i$1③;/
      - xform/ì([^;]*);/i$1④;/
      - xform/ū([^;]*);/u$1①;/
      - xform/ú([^;]*);/u$1②;/
      - xform/ǔ([^;]*);/u$1③;/
      - xform/ù([^;]*);/u$1④;/
      - xform/ǖ([^;]*);/v$1①;/
      - xform/ǘ([^;]*);/v$1②;/
      - xform/ǚ([^;]*);/v$1③;/
      - xform/ǜ([^;]*);/v$1④;/
      - xform/ü/v/
      - xform/ń([^;]*);/n$1②;/
      - xform/ň([^;]*);/n$1③;/
      - xform/ǹ([^;]*);/n$1④;/
      - xform/ḿ([^;]*);/m$1②;/
      - xform/m̀([^;]*);/m$1④;/
      - xlit/①②③④/7890
      - derive/^ng(\d);$/eng$1;/
      - xform/^n(\d);/en$1;/
      - xform/^m(\d);/me$1;/
      - derive/^([jqxy])u(\d);/$1v$2;/
      - derive/^([aoe])([ioun])(\d);/$1$1$2$3;/
      - xform/^([aoe])(ng)?(\d);/$1$1$2$3;/
      - xform/iu(\d);/Ⓠ$1;/
      - xform/uan(\d);/Ⓡ$1;/
      - xform/[uv]e(\d);/Ⓣ$1;/
      - xform/un(\d);/Ⓨ$1;/
      - xform/uo(\d);/Ⓞ$1;/
      - xform/ie(\d);/Ⓟ$1;/
      - xform/i?ong(\d);/Ⓢ$1;/
      - xform/ing(\d);/Ⓚ$1;/
      - xform/uai(\d);/Ⓚ$1;/
      - xform/eng(\d);/Ⓖ$1;/
      - xform/[iu]ang(\d);/Ⓛ$1;/
      - xform/ang(\d);/Ⓗ$1;/
      - xform/ian(\d);/Ⓜ$1;/
      - xform/iao(\d);/Ⓝ$1;/
