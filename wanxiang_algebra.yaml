      - xform/([a-z]+)an(\d);/$1Ⓙ$2;/
      - xform/([a-z]+)ao(\d);/$1Ⓒ$2;/
      - xform/([a-z]+)en(\d);/$1Ⓕ$2;/
      - xform/([a-z]+)ei(\d);/$1Ⓦ$2;/
      - xform/([a-z]+)ou(\d);/$1Ⓩ$2;/
      - xform/^sh/Ⓤ/
      - xform/^ch/Ⓘ/
      - xform/^zh/Ⓥ/
      - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/

  直接辅助:  ########################################位于词库第三个分号后
    __append:
      - derive/^([a-z◯]+)(\d?);.*$/$1/             # 纯双拼的情况
      #分号后面第一组辅助码
      - derive/^([a-z◯]+)(\d?);.*$/$1$2/           # 双拼+声调的情况
      - derive/^([a-z◯]+)(\d?);([a-z]).*$/$1$3/    # 双拼+1位辅助码的情况
      - derive|^([a-z◯]+)(\d?);([a-z]).*$|$1$2$3|  # 双拼+声调+1位辅助码
      - derive|^([a-z◯]+)(\d?);([a-z]).*$|$1$3$2|  # 双拼+1位辅助码+声调
      - abbrev/^([a-z◯]+)(\d?);([a-z])([a-z]).*$/$1$3$4/   # 双拼+2位辅助码的情况 (简拼)
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$4$2| # 双拼+字母 字母 数字
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$2$3$4| # 双拼+数字 字母 字母
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$2$4| # 双拼+字母 数字 字母
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$4/|  # 双拼+2位辅助码+/
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$4o|  # 双拼+2辅码+o (应对小企鹅等环境)
      #分号后面第二组辅助码 (极速跳过第一组，直达逗号)
      - derive/^([a-z◯]+)(\d?);[^,]*,([a-z]).*$/$1$3/       # 双拼+1位辅助码的情况
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z]).*$|$1$2$3|     # 双拼+声调+1位辅助码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z]).*$|$1$3$2|     # 双拼+1位辅助码+声调
      - abbrev/^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$/$1$3$4/   # 双拼+2位辅助码的情况
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$4$2| # 双拼+字母 字母 数字
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$2$3$4| # 双拼+数字 字母 字母
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$2$4| # 双拼+字母 数字 字母
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$4/|  # 双拼+2位辅助码+/
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$4o|  # 双拼+2辅码+o (应对小企鹅等环境)
      - erase/^([a-z]+);.*$/    # 删除原始带分号编码，加速检索，并防大写变体套娃
      - xform/◯/;/  #对于微软双拼、搜狗双拼，前面将分号保护了起来，现在放出来让其发挥作用
      # 大写变体
      # 格式 A: 声调在最前 (如 ab1c, ab1cd)
      - derive|^([a-z]{2})(\d)([a-z])([a-z]?)$|$1$2\u$3$4|     # 第1位辅码大写
      - derive|^([a-z]{2})(\d)([a-z])([a-z])$|$1$2$3\u$4|      # 第2位辅码大写（严格限定必须有第2位，防废码）
      - derive|^([a-z]{2})(\d)([a-z])([a-z])$|$1$2\u$3\u$4|    # 全大写（严格限定）
      # 格式 B: 声调在中间 (仅针对 ab1cd 被 derive 派生出的 abc1d 变体)
      - derive|^([a-z]{2})([a-z])(\d)([a-z])$|$1\u$2$3$4|
      - derive|^([a-z]{2})([a-z])(\d)([a-z])$|$1$2$3\u$4|
      - derive|^([a-z]{2})([a-z])(\d)([a-z])$|$1\u$2$3\u$4|
      # 格式 C: 声调在最后 (如 abc1, abcd1)
      - derive|^([a-z]{2})([a-z])([a-z]?)(\d)$|$1\u$2$3$4|
      - derive|^([a-z]{2})([a-z])([a-z])(\d)$|$1$2\u$3$4|      # 严格限定必须有第2位
      - derive|^([a-z]{2})([a-z])([a-z])(\d)$|$1\u$2\u$3$4|    # 严格限定必须有第2位
      # 格式 D: 无声调纯辅码 (如 abc, abcd)
      - derive|^([a-z]{2})([a-z])([a-z]?)$|$1\u$2$3|
      - derive|^([a-z]{2})([a-z])([a-z])$|$1$2\u$3|            # 严格限定必须有第2位
      - derive|^([a-z]{2})([a-z])([a-z])$|$1\u$2\u$3|          # 严格限定必须有第2位

  间接辅助:  ########################################位于词库第三个分号后
    __append:
      - xform/ⅲ//  # 用于Lua判断是否处于间接辅助的标记
      # 纯双拼与声调
      - derive/^([a-z◯]+)\d?;.*$/$1/        # 纯双拼的情况
      - derive/^([a-z◯]+)(\d?);.*$/$1$2/    # 双拼+声调的情况
      # 分号后面第一组辅助码 (引入 / 间接标记)
      - derive|^([a-z◯]+)(\d?);([a-z]).*$|$1/$3|          # 双拼+/1位辅码
      - derive|^([a-z◯]+)(\d?);([a-z]).*$|$1$2/$3|        # 双拼+声调+/1位辅码
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1/$3$4|     # 双拼+/2位辅码
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$2/$3$4|   # 双拼+声调+/2位辅码
      # 分号后面第二组辅助码 (利用 [^,]* 零回溯直达逗号)
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z]).*$|$1/$3|          # 双拼+/1位辅码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z]).*$|$1$2/$3|        # 双拼+声调+/1位辅码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1/$3$4|     # 双拼+/2位辅码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$2/$3$4|   # 双拼+声调+/2位辅码
      - erase/^([a-z]+);.*$/    # 删除原始带分号编码，加速检索
      - xform/◯/;/              # 释放微软/搜狗双拼保护的分号
      # 以下直接大写辅助
      - derive|^([a-z]{2})(\d?)/([a-z])([a-z]?)$|$1$2\u$3\u$4|
      - derive|^([a-z]{2})(\d?)/([a-z])([a-z]?)$|$1\u$3$2\u$4|
      - derive|^([a-z]{2})(\d?)/([a-z])([a-z]?)$|$1\u$3\u$4$2|

