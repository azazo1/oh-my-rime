[project]
name = "jev-bridge"
version = "0.1.0"
description = "给 Rime 万象拼音提供 typed-decision 候选重排的本地缓存与后端转接服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
laya = ["laya-mlx"]

[project.scripts]
jev-bridge = "jev_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
